<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a2a2a"/><stop offset="100%" stop-color="#0a0a0a"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c8ff1c"/><stop offset="100%" stop-color="#a8e000"/></linearGradient>
  </defs>
  <!-- printer base -->
  <rect x="40" y="290" width="240" height="40" rx="4" fill="url(#frame)" stroke="#444" stroke-width="2"/>
  <!-- frame -->
  <rect x="50" y="50" width="220" height="240" rx="4" fill="none" stroke="#333" stroke-width="3"/>
  <rect x="60" y="60" width="200" height="220" fill="#0a0a0a"/>
  <!-- gantry rail -->
  <rect x="50" y="130" width="220" height="6" fill="#444"/>
  <!-- print head -->
  <rect x="140" y="120" width="40" height="30" fill="url(#g)" stroke="#7da300" stroke-width="2"/>
  <circle cx="160" cy="155" r="3" fill="#c8ff1c"/>
  <!-- print bed -->
  <rect x="80" y="240" width="160" height="10" fill="#444"/>
  <!-- printed object -->
  <path d="M130,200 L190,200 L185,240 L135,240 Z" fill="url(#g)" opacity="0.85"/>
  <text x="160" y="225" text-anchor="middle" fill="#0a0a0a" font-family="Inter,Arial" font-size="10" font-weight="900">ORK3D</text>
  <!-- accent led -->
  <circle cx="265" cy="320" r="3" fill="#c8ff1c"/>
</svg>
