  <text x="80" y="200" font-family="Inter,Arial" font-size="84" font-weight="900" fill="#fff">ORK<tspan fill="#c8ff1c">3D</tspan></text>
  <text x="80" y="290" font-family="Inter,Arial" font-size="42" font-weight="800" fill="#fff">Trofeos y objetos 3D</text>
