<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8ff1c" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f5c453"/>
      <stop offset="100%" stop-color="#a8782b"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="ribbonBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <ellipse cx="280" cy="320" rx="280" ry="280" fill="url(#bgGlow)"/>

  <!-- Big trophy with soccer ball -->
  <g transform="translate(180,80)">
    <!-- ball -->
    <circle cx="100" cy="100" r="80" fill="url(#dark)" stroke="#444" stroke-width="2"/>
    <polygon points="100,40 130,60 120,95 80,95 70,60" fill="#0a0a0a" stroke="#666" stroke-width="1.5"/>
    <polygon points="100,40 130,60 145,40 130,20" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
    <polygon points="70,60 80,95 50,110 35,75" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
    <polygon points="130,60 120,95 150,110 165,75" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
    <polygon points="80,95 120,95 130,135 70,135" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
    <!-- handles -->
    <path d="M20,180 Q5,210 30,260 Q60,290 90,280" stroke="url(#gold)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M180,180 Q195,210 170,260 Q140,290 110,280" stroke="url(#gold)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- cup body -->
    <path d="M30,180 L170,180 L160,300 Q100,330 40,300 Z" fill="url(#gold)" stroke="#7d5c1f" stroke-width="2"/>
    <!-- base -->
    <rect x="65" y="320" width="70" height="20" fill="url(#gold)"/>
    <rect x="55" y="340" width="90" height="40" fill="url(#dark)" stroke="#333" stroke-width="1.5"/>
    <rect x="62" y="350" width="76" height="22" fill="#0a0a0a"/>
    <text x="100" y="365" text-anchor="middle" fill="#c8ff1c" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700">CAMPEÓN</text>
    <text x="100" y="375" text-anchor="middle" fill="#c8ff1c" font-family="Inter,Arial,sans-serif" font-size="6" font-weight="500">TORNEO 2024</text>
  </g>

  <!-- Goalkeeper glove -->
  <g transform="translate(380,140)">
    <path d="M30,50 L120,40 L130,180 L90,220 L20,210 L10,120 Z" fill="url(#dark)" stroke="#444" stroke-width="2"/>
    <rect x="30" y="60" width="20" height="60" rx="6" fill="#1a1a1a"/>
    <rect x="55" y="55" width="20" height="70" rx="6" fill="#1a1a1a"/>
    <rect x="80" y="55" width="20" height="70" rx="6" fill="#1a1a1a"/>
    <rect x="105" y="60" width="18" height="60" rx="6" fill="#1a1a1a"/>
    <path d="M40,160 L110,150 L115,180 L40,185 Z" fill="url(#gold)"/>
    <text x="80" y="178" text-anchor="middle" fill="#0a0a0a" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="900">MEJOR</text>
    <text x="80" y="190" text-anchor="middle" fill="#0a0a0a" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700">ARQUERO</text>
    <rect x="20" y="210" width="100" height="14" fill="#0a0a0a"/>
  </g>

  <!-- Medal -->
  <g transform="translate(120,360)">
    <path d="M50,0 L20,80 L40,100 L80,90 Z" fill="url(#ribbon)" opacity="0.9"/>
    <path d="M70,0 L100,80 L80,100 L40,90 Z" fill="url(#ribbonBlue)" opacity="0.9"/>
    <circle cx="60" cy="120" r="50" fill="url(#gold)" stroke="#7d5c1f" stroke-width="2.5"/>
    <circle cx="60" cy="120" r="36" fill="#0a0a0a"/>
    <text x="60" y="115" text-anchor="middle" fill="#c8ff1c" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="900">MVP</text>
    <text x="60" y="130" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="6" font-weight="600">DE LA FECHA</text>
  </g>

  <!-- Mini trophy -->
  <g transform="translate(420,400)">
    <path d="M5,30 Q-10,55 10,80 Q25,90 40,85" stroke="url(#gold)" stroke-width="6" fill="none"/>
    <path d="M75,30 Q90,55 70,80 Q55,90 40,85" stroke="url(#gold)" stroke-width="6" fill="none"/>
    <path d="M10,30 L70,30 L62,100 Q40,118 18,100 Z" fill="url(#gold)" stroke="#7d5c1f" stroke-width="1.5"/>
    <rect x="30" y="115" width="20" height="10" fill="url(#gold)"/>
    <rect x="22" y="125" width="36" height="20" fill="url(#dark)"/>
  </g>
</svg>
